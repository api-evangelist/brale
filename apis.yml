aid: brale
name: Brale
description: >-
  Brale is a regulated stablecoin issuance and orchestration platform. Its Issuance
  and Orchestration API lets businesses create their own fiat-backed stablecoins and
  move value across fiat rails and blockchains — onramps, offramps, swaps, custody,
  and payouts — with mint/burn execution, reserves, custody, settlement, and reporting
  handled by Brale. Developers authenticate with OAuth2 client-credentials and manage
  customer accounts (KYB/KYC), on-chain and off-chain addresses, transfers, automations
  (virtual U.S. account/routing numbers that auto-mint stablecoins on fiat deposit),
  self-attested tokenization (mints, burns, transfers), and webhooks across Stellar,
  Solana, Base, Ethereum, Polygon, Avalanche, Celo, Optimism, Arbitrum, and Canton.
