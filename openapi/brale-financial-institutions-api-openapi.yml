openapi: 3.2.0
info:
  title: Brale Issuance and Orchestration Financial Institutions API
  version: 2.3.1
  description: 'Brale supports stablecoin issuance and orchestration, enabling businesses and

    ecosystems to create their own stablecoins and convert between fiat and stablecoins

    seamlessly. From stablecoin onramps, offramps, and swaps to custody and payouts, the

    Brale API makes it easy to build stablecoin-enabled products.


    NOTE: All resource IDs (including account_id, address_id, financial_institution_id,

    and automation_id) are KSUIDs—27-character alphanumeric strings that are sortable

    by time. Examples showing UUIDs are incorrect.


    **What''s new in 2.3.1**

    - Unified **Addresses** model for on-chain and off-chain endpoints

    - `Transfers` now accepts **address_id only** (no financial_institution_id)

    - Optional `brand` object to control bank statement presentation (`branding` still accepted as legacy alias)

    - Added off-chain rails: `ach_credit`, `same_day_ach_credit`, `ach_debit`, `same_day_ach_debit`, `rtp-credit`

    - Plaid endpoints moved to `/accounts/{account_id}/plaid/*`

    - `Financial Institutions` marked **deprecated** (migration path to **Addresses**)

    - Create Account now uses `CreateManagedAccountRequest` with `beneficial_owners`, `business_controller`, and `EndUserTosAttestation`.

    - Transfers now accept `brand` (replaces `branding`, still aliased in docs).

    - Plaid endpoints updated to return `address_id` and accept `transfer_types`.

    - Off-chain Address creation uses `CreateExternalAddressRequest` oneOf with bank + blockchain variants.

    - FI endpoints kept but marked deprecated; use Addresses instead.

    - `rtp_credit` is the canonical RTP rail name.


    **FedNow**

    - Added the `fednow_credit` rail. Outbound: create a Transfer with

    `destination.transfer_type: fednow_credit` to a bank Address that lists

    `fednow_credit` in `transfer_types`. Inbound: payers send FedNow credits to an

    active Automation''s `source.funding_instructions`; Brale creates the Transfer

    automatically with `source.transfer_type: fednow_credit`.

    - Simulate a testnet FedNow deposit with `transfer_type: fednow` on

    `POST /accounts/{account_id}/automations/{automation_id}/simulations/deposits`.

    - `bank_address` and `beneficiary_address` are required only when an external

    bank Address requests `wire`.

    - FedNow availability depends on account enablement.'
servers:
- url: https://api.brale.xyz
  description: Production server
security:
- BearerAuth: []
tags:
- name: Financial Institutions
  description: Legacy (deprecated) bank endpoints. Use Addresses instead.
paths:
  /accounts/{account_id}/financial-institutions:
    get:
      tags:
      - Financial Institutions
      operationId: ListFinancialInstitutions
      summary: Fetch all financial institutions
      description: 'Returns all financial institutions associated with the given account.


        Deprecated. Use Addresses. Create an off-chain Address (ACH/Wire/RTP) and pass its `address_id` to Transfers. Plaid endpoints have moved to `/accounts/{account_id}/plaid/*`.'
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Ksuid'
        description: The ID of the account
      responses:
        '200':
          description: A list of financial institutions
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GetFinancialInstitutionsResponse'
      deprecated: true
  /accounts/{account_id}/financial-institutions/external:
    post:
      tags:
      - Financial Institutions
      operationId: createFinancialInstitution
      summary: Create a new external financial institution
      description: 'Links an external bank account to the specified account (ACH, wire, etc.).


        Deprecated. Use Addresses. Create an off-chain Address (ACH/Wire/RTP) and pass its `address_id` to Transfers. Plaid endpoints have moved to `/accounts/{account_id}/plaid/*`.'
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Ksuid'
        description: The ID of the account
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
        example: idemp-123e4567-e89b-12d3-a456-426614174000
        description: 'A unique string used to prevent duplicate operations. Each POST request must use a new idempotency key. Use a UUIDv4 string. Example: `idemp-123e4567-e89b-12d3-a456-426614174000`

          '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialInstitutionCreateRequest'
      responses:
        '201':
          description: Financial institution successfully created
          content:
            '*/*':
              schema:
                type: object
                properties:
                  id:
                    $ref: '#/components/schemas/Ksuid'
      deprecated: true
  /accounts/{account_id}/financial-institutions/{id}:
    get:
      tags:
      - Financial Institutions
      operationId: getFinancialInstitution
      summary: Fetch a specific financial institution
      description: 'Retrieves details for the specified financial institution (bank account).


        Deprecated. Use Addresses. Create an off-chain Address (ACH/Wire/RTP) and pass its `address_id` to Transfers. Plaid endpoints have moved to `/accounts/{account_id}/plaid/*`.'
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Ksuid'
        description: The ID of the account
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Ksuid'
        description: The ID of the financial institution
      responses:
        '200':
          description: A financial institution object
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FinancialInstitution'
      deprecated: true
components:
  schemas:
    BankDetails:
      title: Bank
      type: object
      properties:
        owner:
          type: string
          example: Jane Doe
        account_number:
          type: string
          example: '1234567890'
        routing_number:
          type: string
          example: 063108680
        name:
          type: string
          description: The name of the bank
          example: Example Bank
        address:
          $ref: '#/components/schemas/AccountAddress'
        account_type:
          type: string
          example: checking
      required:
      - owner
      - account_number
      - routing_number
      - name
      - account_type
    GetFinancialInstitutionsResponse:
      type: object
      properties:
        financial_institutions:
          type: array
          items:
            $ref: '#/components/schemas/FinancialInstitution'
    AccountAddress:
      title: AccountAddress
      type: object
      properties:
        street_line_1:
          type: string
          example: 123 Main St
        street_line_2:
          type: string
          example: Apt C
        city:
          type: string
          example: Des Moines
        state:
          type: string
          example: Iowa
        zip:
          type: string
          example: '12345'
      required:
      - street_line_1
      - city
      - state
      - zip
    FinancialInstitutionCreateRequest:
      title: FinancialInstitutionCreateRequest
      type: object
      properties:
        name:
          type: string
          example: Business Checking Account
        transfer_type:
          type: array
          items:
            type: string
          example:
          - ach
          - wire
        bank_details:
          $ref: '#/components/schemas/BankDetails'
      required:
      - name
      - transfer_type
      - bank_details
    Ksuid:
      title: Kusid
      type: string
      format: ksuid
      pattern: ^[a-zA-Z0-9]{27}$
      example: 2VcUIIsgARwVbEGlIYbhg6fGG57
    FinancialInstitution:
      title: FinancialInstitution
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Ksuid'
        name:
          type: string
          example: Business Checking Account
        status:
          type: string
          enum:
          - processing
          - active
          - archived
          example: active
        bank_details:
          $ref: '#/components/schemas/BankDetails'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Use the Bearer token returned from the Auth endpoint via OAuth2 client_credentials flow. Include the token in the "Authorization: Bearer <token>" header.

        '
    oauth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.brale.xyz/oauth2/token
          scopes:
            accounts:read: Read account details
            accounts:write: Create or update accounts
            addresses:read: Read address details
            addresses:write: Create addresses
            automations:read: Read automations
            automations:write: Create automations
            network:testnet: Access testnet-only operations, such as Automation deposit simulation
            financial-institutions:read: Read FI details (legacy)
            financial-institutions:write: Create FI (legacy)
            transfers:read: Read transfers
            transfers:write: Create transfers
x-tagGroups:
- name: Core
  tags:
  - Accounts
  - Addresses
  - Transfers
  - Automations
  - Plaid
- name: Legacy
  tags:
  - Financial Institutions
  - Orders
